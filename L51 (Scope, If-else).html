<!DOCTYPE html>

</head>
<body>
  <div>
    <ul>
        <li>Item-1</li>
        <li>Item-2</li>
        <li>Item-3</li>
        <li>Item-4</li>
        <li>Item-5</li>
        <li>Item-6</li>
        <li>Item-7</li>
        <li>Item-8</li>
        <li>Item-9</li>
        <li>Item-10</li>
    </ul>
  </div>

  <script>
    var string1 = "This is a string";
    console.log(string1) 
 
    let a = "u";
    {
        let a = "u6";
        console.log(a)
    }
    console.log(a)

    let age = 34;
    if(age>18)
    {
        console.log("You can drive");
    }
    else{
        console.log("You can not drive");
    }

      const cups = 25;
      switch (cups) {
        case 4: 
        console.log("The value of cup is 4")
        break;
        case 25: 
        console.log("The value of cup is 25")
        break;
        case 36: 
        console.log("The value of cup is 36")
        break;
        case 15: 
        console.log("The value of cup is 15")
        break;
        default: 
        console.log("The value of cups is none of 4, 25, 36, 15")
        break;

      }

 
  </script>
