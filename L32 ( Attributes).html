<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atributes</title>
<style>
    .container{
        display: block;
        width: 233px;
        height: auto;
        margin: auto;
    }
    input{
        display: block;
        text-align: center;
    }
    input[type="text"]{
        padding: 23px;
        border: 5px solid red;

    }
    a{
        font-size: xx-large;
        color: green;
        background-color: aquamarine;
        border: 5px solid violet;

    }
    li:nth-child(2n+0){
        color: red;
        background-color: bisque;
    }
    li:nth-child(2n+1){
        color: yellow;
        background-color: black;
    }
</style>
</head>
<body>
    <div class="container">
        <a href="https://google.com" target="_blank">Go to Google</a><br><br>
        <form action="" class="form-control">
            <input type="text" placeholder="Enter your name"><br><br>
            <input type="password" placeholder="Enter your password"><br><br>
            <input type="Submit" value="Submit">
            <ul>
                <li class="item" id="item1">Item 1</li>
                <li class="item" id="item2">Item 2</li>
                <li class="item" id="item3">Item 3</li>
                <li class="item" id="item4">Item 4</li>
                <li class="item" id="item5">Item 5</li>
                <li class="item" id="item6">Item 6</li>
                <li class="item" id="item7">Item 7</li>
                <li class="item" id="item8">Item 8</li>
                <li class="item" id="item9">Item 9</li>
                <li class="item" id="item10">Item 10</li>
            </ul>
        </form>
       

    </div>
</body>
</html>
