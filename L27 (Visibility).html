<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visibility</title>
<style>
    .box{
        width: 170px;
        height: 170px;
        border: 5px solid black;
    margin: 5px;
    display: inline-block;
    }
    #box1{
        position: relative;
        top: 34px;
        /* by this property the condition of overlaping arise */
        background-color: green;
    }
    #box2{
        position: relative;
        top: 14px;
        background-color: yellow;
        /* visibility: hidden; 
        
        will hide the element but willl show the empty space */



        /* display: none; */
        
        /* will hide the element and the space both */
    }
    #box3{
        background-color: violet;
    }
    #box4{
        background-color: antiquewhite;
    }
</style>
</head>
<body>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>
</body>
</html>
