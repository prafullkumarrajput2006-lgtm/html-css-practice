<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors for ID</title>
   <style>
    #redElement{
        color: pink;
        background-color: purple;
    }
   </style>
</head>
<body>
<h2>CSS Selectors</h2>
<p>This is a simple paragraph to demonstrate CSS Selectors</p>
<div>
    <p>
        this is the para which is not in the form of CSS yet
    </p>
</div>
         <!-- Here we select the part of the website which should be the select for the CSS  -->


         <!-- In the begginning program we select all the paragraph i the CSS while in the next program we will select the some specific part of the website for CSS by id  -->

<p id="redElement">This is the some specific part of the website which will be the select for CSS </p>

</body>
</html>
