<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creating Animations & Keyframe</title>
<style>
    .container{
        background-color: yellow;
    }
    .box{
        background-color: green;
        width: 250px;
        height: 250px;
        position: relative;
        animation-name: Prafull1;
        animation-duration: 3s;
        animation-iteration-count: 5;
        animation-fill-mode: forwards;
        /* animation-fill-mode: alternate; */
        /* animation-timing-function: ease-in; */
        /* It is for speed the animation in the beginning and last */

        animation-delay: 2s;
        /* Animation will start after some time  */

        animation-direction: reverse;
        /* For reverse the direction */

    }
    @keyframes Prafull1{
        from{
            width: 100px;
        }
        top{
            width: 400px;
        }
    }
    @keyframes Prafull1{
        0%{
            top: 0px;
            left: 0px;

        }
        25%{
               top: 250px;
               left: 0px;

        }
       
        75%{ 
            top: 250pxr;
            left: 250px;

        }
        100%{
            top: 250px;
            left: 0px;
        }
    }
</style>
</head>
<body>
    <div class="container">
        <div class="box">
            This is a box

        </div>

    </div>
</body>
</html>
