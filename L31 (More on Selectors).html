<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More on Selectors</title>
<style>
    h1{
        background-color: aquamarine;
        color: blueviolet;
        font-weight: bold;
        font-style: italic;
        text-align: center;

    }
    div p{
        color: white;
        background-color: black;
    }
</style>
</head>
<body>
    <h1>This is more Selectors</h1>
    <div class="container">
        <div class="row">
            <ul>
               <li class="item"><p>This is the another para inside the ul</p>

               </li>
            </ul>
        
            <p>This is a para</p>
        </div>
        <p>This is another para</p>


    </div>
    <p>This is the outer most para</p> 

<!-- If we want to select  the real child of the div then we hacvd to use the specific tag for apply the css {div > p}  -->

</body>
</html>
