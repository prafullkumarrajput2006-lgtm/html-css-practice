<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors for class</title>
<style>
    #firstPara{
        color: red;
        background-color: orange;
    }

    .redElement{
        color: rgb(62, 24, 175);
        background-color: violet;
    }

    footer,span{
        background-color: pink;
    }
</style>
</head>
<body>
    <h2>CSS Selectors</h2>
   <p id="firstpara"This is the first para></p>
    <p id="secondPara" class="redElement">This is the second para</p>
    <p>This is the third para</p>

    <span>This is span</span>
    <footer>This is footer</footer>
</body>
</html>
