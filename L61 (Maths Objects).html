<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths Objects in JS</title>

</head>
<body>
<div class="container">
  <h1>This is math Object Tutorial</h1>
</div>

<script>

  // Printing the Math Objrcts

    let m = Math;
    console.log(m)

    // Printing the constants from Maths Objects

    console.log("Tha value of Math.E is", Math.E)
    console.log("Tha value of Math.PI is", Math.PI)
    console.log("Tha value of Math.LN2 is", Math.LN2)
    console.log("Tha value of Math.SQRT1_2 is", Math.SQRT1_2)
    console.log("Tha value of Math.LOG2E is", Math.LOG2E)

     // Printing the Functions from Maths Objects

     let a = 34.4646;
     let b = 86;
     console.log("Tha value of a and b is ", a,b);
     console.log("Tha value of a and b rounded is ", Math.round(a), Math.round(b));
     
     console.log("3 raised to the power od 2 is ", Math.pow(3,2));

     console.log("9 raised to the power od 5 is ", Math.pow(9,5));

     console.log("15 raised to the power od 2 is ", Math.pow(15,2));

     console.log("Square root of 96 is", Math.sqrt(96));

     console.log("Square root of 225 is", Math.sqrt(225));

     console.log("Square root of 512 is", Math.sqrt(512));

     // Ceil and floor

     console.log("5.8 rounded up to nearest integer is", Math.ceil(5.8));
     console.log("8.3 rounded up to nearest integer is", Math.ceil(8.3));

     //Abs Function

     console.log("Absolute value of 5.66 is", Math.abs(5.66));
     console.log("Absolute value of -5.66 is", Math.abs(-5.66));

     // Trinometric Function

      console.log("Tha value of sin(pi) is", Math.sin(Math.PI))

      //Min and Max Function

      console.log("Minimum Value of 4, 5, 6 is",Math.min(4,5,6));
      console.log("Miximum Value of 4, 5, 6 is",Math.max(4,5,6));

      //Generating the random Number
      
      let r = Math.random();
      let r1_100 = Math.random();
      console.log("The random number is",r)
      console.log("The random number is",r1_100)

</script>
</body>
</html>
