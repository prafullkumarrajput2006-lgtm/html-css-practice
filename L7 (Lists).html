<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables and lists</title>
</head>
<body>
    <ul type="Square">
        <li>Prafull Rajput</li>
        <li>Piyush Saini</li>
        <li>Tushar Pal</li>
        <li>
            <ul>
                <li>students of AKGEC</li>
            </ul>
        </li>
    </ul>

    <ol type="A">
        <li>Prafull Rajput</li>
        <li>Piyush Siani</li>
        <ol>
            <li>Students of AKGEC</li>
        </ol>
        <li>Tushar Pal</li>
    </ol>
</body>
</html>
