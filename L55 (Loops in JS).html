<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        This is about Loops
    </div>

    <script>
               // For Loop in JS

               console.log("This is tutorial 55");

               let i =0;
               for(i=0; i<5; i++){
                   console.log(i); 
               }
       
               let friend = ["Prafull", "Piyush", "Tushar", "Shriti", "Manisha", "Sneha"];
              
       
               friend.forEach(function f(element) {
                   console.log("Hello Friends," + element + " to modern JavaScript ")
               });
 
        
        //While Loop in JS

        let i = 0;
        while(i<4){
            console.log(`${i} is less than 4`);
            i++;
        }

        //Do While Loop in JS

        do{
            let i = 24;
            console.log(`${i} is less than 4`);
            i++;
        } while(i<4);
        

      

    </script>
</body>
</html>
