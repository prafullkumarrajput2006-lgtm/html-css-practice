<!DOCTYPE html>
<html>
<head>
    <title>BharatGPT</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
        }
        #chatbox {
            width: 60%;
            margin: auto;
            margin-top: 50px;
        }
        input {
            width: 70%;
            padding: 10px;
        }
        button {
            padding: 10px;
            background: #22c55e;
            border: none;
            color: white;
        }
        .msg {
            margin: 10px;
        }
    </style>
</head>
<body>

<h1>🇮🇳 BharatGPT</h1>

<div id="chatbox">
    <div id="messages"></div>

    <input id="input" placeholder="Type in Hindi / Hinglish..." />
    <button onclick="sendMessage()">Send</button>
</div>

<script>
function sendMessage() {
    let input = document.getElementById("input").value;

    fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({message: input})
    })
    .then(res => res.json())
    .then(data => {
        let messages = document.getElementById("messages");

        messages.innerHTML += "<div class='msg'><b>You:</b> " + input + "</div>";
        messages.innerHTML += "<div class='msg'><b>AI:</b> " + data.reply + "</div>";

        document.getElementById("input").value = "";
    });
}
</script>

<script src=""></script>


</body>
</html>
