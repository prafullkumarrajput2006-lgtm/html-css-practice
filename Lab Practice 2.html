<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Detail Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            max-width: 700px;
            margin: auto;
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
        }
        fieldset {
            margin-bottom: 15px;
            border: 1px solid #aaa;
            border-radius: 6px;
            padding: 15px;
        }
        legend {
            font-weight: bold;
            color: #222;
        }
        label {
            display: block;
            margin: 8px 0 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 95%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button[type="submit"] {
            background: #28a745;
            color: white;
        }
        button[type="reset"] {
            background: #dc3545;
            color: white;
        }
    </style>
</head>
<body>

    <h1>📝 Student Detail Form</h1>

    <form>
        <!-- Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">

           <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="Male" />
        <label for="male" style="display:inline;">Male</label>

        <input type="radio" id="female" name="gender" value="Female" />
        <label for="female" style="display:inline;">Female</label>

        <input type="radio" id="other" name="gender" value="Other" />
        <label for="other" style="display:inline;">Other</label>

            <label for="photo">Upload Photo:</label>
            <input type="file" id="photo" name="photo" accept="image/*">
        </fieldset>

        <!-- Academic Details -->
        <fieldset>
            <legend>Academic Details</legend>

            <label for="course">Course:</label>
            <select id="course" name="course">
                <option value="btech">B.Tech</option>
                <option value="mtech">M.Tech</option>
                <option value="mba">MBA</option>
                <option value="bsc">B.Sc</option>
            </select>

            <label for="Passing year"> Passing Year:</label>
            <input type="number" id="year" name="year" min="1" max="4">

            <label for="subjects">Favorite Subject (with suggestions):</label>
            <input list="subjectList" id="subjects" name="subjects">
            <datalist id="subjectList">
                <option value="Mathematics">
                <option value="Computer Science">
                <option value="Cyber Security">
                <option value="Database Management">
            </datalist>

           
        </fieldset>

        <!-- Contact Information -->
        <fieldset>
            <legend>Contact Information</legend>

            <label for="email">Email ID:</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com">

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10 digit number">

            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="3"></textarea>
        </fieldset>

        <!-- Feedback -->
        <fieldset>
            <legend>Feedback</legend>
            <label for="feedback">Share your experience:</label>
            <textarea id="feedback" name="feedback" rows="4" placeholder="Write here..."></textarea>
            
          
        </fieldset>

        <!-- Buttons -->
        <fieldset>
            <legend>Submit Section</legend>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </fieldset>
    </form>

</body>
</html>
