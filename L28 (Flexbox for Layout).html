<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox for Better Layout</title>
    <style>
        .container{
            height: 500px;
            width: 550px;
            border: 5px solid black;
            background-color: aqua;
            display: flex;

            /* Felx properties for flex container */

            flex-direction: row; 
            /* flex-direction: column;
            flex-direction: row-reverse;
            flex-direction: column-reverse; */

            flex-wrap: wrap;
            flex-wrap: wrap-reverse;
            flex-flow: row-reverse;
text-align: center;
justify-content: center;
justify-content: space-between;
justify-content: space-evenly; 
align-items: center ;

           
        }
        .item{
            color: blueviolet;
            background-color: antiquewhite;
            border: 2px solid green;
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>This is the Flexbox Video</h1>
    <div class="container">
        <div class="item" id="item1">First Box</div>
    <div class="item" id="item2">Second Box</div>
    <div class="item" id="item3">Third Box</div>
    <div class="item" id="item4">Fourth Box</div>
    <div class="item" id="item5">Fifth Box</div> 

    </div>
</body>
</html>
